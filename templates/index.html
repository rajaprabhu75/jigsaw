.rules {
  text-align: left;
  background: #f9f9ff;
  border: 1px solid #e6e3ff;
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
}

.rules h3 {
  margin: 0 0 8px;
  font-size: 1rem;
  color: #333;
}

.rules ul {
  margin: 0;
  padding-left: 20px;
  font-size: 0.85rem;
  color: #555;
  line-height: 1.5;
}
